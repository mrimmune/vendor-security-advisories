
name: Fortinet PSIRT Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Fortinet advisories
        run: python fortinet_collector.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          data = json.loads(Path('fortinet_advisories.json').read_text(encoding='utf-8'))
          valid = sum(x.get('ExtractionStatus') == 'Version table extracted' for x in data)
          root = ET.parse('fortinet_enriched.xml').getroot()
          rss_items = root.findall('./channel/item')

          print(f'Collected: {len(data)}, extracted: {valid}, RSS items: {len(rss_items)}')

          if not data or valid == 0 or len(rss_items) != valid:
              raise SystemExit('Missing or inconsistent enriched RSS output')

          for item in rss_items:
              payload = json.loads(item.findtext('description'))
              if not payload.get('AffectedVersions'):
                  raise SystemExit('RSS item missing affected versions')
          PY

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fortinet_advisories.json fortinet_enriched.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update Fortinet PSIRT advisories and enriched RSS"
            git push
          fi
