name: Cisco PSIRT Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

concurrency:
  group: cisco-psirt-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests
      - name: Collect Cisco advisories
        env:
          CISCO_CLIENT_ID: ${{ secrets.CISCO_CLIENT_ID }}
          CISCO_CLIENT_SECRET: ${{ secrets.CISCO_CLIENT_SECRET }}
        run: python cisco_collector.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cisco_advisories.json cisco_enriched.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Update Cisco PSIRT feed'
            git push
          else
            echo 'No changes to commit'
          fi
